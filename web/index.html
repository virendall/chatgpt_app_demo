<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Healthcare Widget</title>
    <script>

        window.openai = {
            "toolOutput": {
                "journey": {
                    "journeyId":
                        "plan-benefits",
                    "title":
                        "Plan Benefits",
                    "description":
                        "Coverage details, comparisons",
                    "color":
                        "blue",
                    "icon":
                        "📘",
                    "steps":
                        [
                            {
                                "type": "gradient-card",
                                "color": "blue",
                                "title": "Your Plan Benefits",
                                "subtitle": "Let me help you understand your coverage",
                                "stats": [
                                    {
                                        "label": "Deductible",
                                        "value": "$600/$1K",
                                        "progress": 0.6
                                    },
                                    {
                                        "label": "Out-of-pocket",
                                        "value": "$500/$2K",
                                        "progress": 0.25
                                    }
                                ]
                            },
                            {
                                "type": "glass-card",
                                "title": "Coverage Highlights",
                                "subtitle": "Tap to learn more",
                                "items": [
                                    {
                                        "id": "preventive",
                                        "icon": "❤️",
                                        "label": "Preventive Care",
                                        "sublabel": "Annual checkups, vaccines",
                                        "cost": "$0"
                                    },
                                    {
                                        "id": "rx",
                                        "icon": "💊",
                                        "label": "Generic Rx",
                                        "sublabel": "30-day supply",
                                        "cost": "$10"
                                    },
                                    {
                                        "id": "urgent",
                                        "icon": "🚑",
                                        "label": "Urgent Care",
                                        "sublabel": "Non-emergency visits",
                                        "cost": "$50"
                                    }
                                ]
                            },
                            {
                                "type": "gradient-card",
                                "color": "green",
                                "title": "Key Takeaways",
                                "icon": "✓",
                                "checkpoints": [
                                    "You're 60% toward deductible",
                                    "In-network saves 50%",
                                    "Preventive care is free"
                                ]
                            }
                        ],
                    "actions":
                        [
                            [
                                {
                                    "label": "What's covered?",
                                    "icon": "❓",
                                    "nextStep": 1
                                }
                            ],
                            [
                                {
                                    "label": "Show summary",
                                    "icon": "📄",
                                    "nextStep": 2
                                }
                            ],
                            [
                                {
                                    "label": "Start over",
                                    "icon": "↺",
                                    "nextStep": 0,
                                    "variant": "outline"
                                }
                            ]
                        ]
                }
            },
            "toolInput": {},
            "toolResponseMetadata": {"simulated": true, "local": true}
        };
        window.openai.callTool = async (name, args) => {
            console.log('Simulated calltool:', name, args);
            return {result: JSON.stringify(window.openai.toolOutput)};
        };
        window.openai.sendFolLowUpMessage = async ({prompt}) => {
            console.Log('Simulated sendFolLowUpMessage:', prompt);
        };
        window.openai.openExternal = ({href}) => {
            window.open(href, '_blank');
        };
        window.openai.requestDisplayMode = async ({mode}) => {
            window.openai.displayMode = mode;
            return {mode};
        };
        window.openai.setWidgetState = async (state) => {
            window.openai.widgetState - state;
        };

        window.__INITIAL_ROUTE__ = '/plan-benefits';
    </script>
</head>

<body>
<div id="container"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
